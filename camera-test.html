<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d766e">
    <meta name="robots" content="noindex">
    <title>カメラ端末診断</title>
    <link rel="stylesheet" href="style.css?v=14">
    <script type="module" src="camera-test.js?v=14"></script>
  </head>
  <body>
    <main class="diagnostic-page">
      <section class="card">
        <p class="eyebrow">カメラ診断 v14</p>
        <h1>カメラ端末診断</h1>
        <p class="help-text">カメラAPI、権限、映像再生を順番に確認します。写真撮影・録音・画像保存・外部送信は行いません。</p>
        <video id="diagnosticVideo" class="diagnostic-video" autoplay muted playsinline webkit-playsinline aria-label="カメラ診断用ライブ映像"></video>
        <div class="diagnostic-actions">
          <button id="runDiagnosticButton" class="primary-button" type="button">診断を開始</button>
          <button id="stopDiagnosticButton" class="secondary-button" type="button" disabled>カメラを停止</button>
          <button id="copyDiagnosticButton" class="secondary-button" type="button" disabled>診断結果をコピー</button>
          <a class="diagnostic-link" href="./?v=14">利益チェッカーへ戻る</a>
        </div>
      </section>
      <section class="card" aria-labelledby="diagnosticResultHeading">
        <h2 id="diagnosticResultHeading">診断結果</h2>
        <p id="diagnosticStatus" class="status-message" role="status">「診断を開始」を押してください。</p>
        <pre id="diagnosticResult" class="diagnostic-result" aria-live="polite">まだ診断していません。</pre>
      </section>
    </main>
  </body>
</html>
